<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💗</title>

<style>
body{
  margin:0;
  font-family:'Comic Sans MS','Poppins',sans-serif;
  background:linear-gradient(180deg,#ffd6e8,#fff);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

.card{
  background:white;
  width:90%;
  max-width:360px;
  padding:25px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  animation:pop 1s ease;
  z-index:2;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

.photo{
  width:150px;
  height:190px;
  border-radius:20px;
  object-fit:cover;
  border:4px solid #ff9ecb;
  box-shadow:0 6px 15px rgba(255,158,203,.6);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.caption{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

h2{
  color:#ff5fa2;
  margin-top:15px;
}

.text{
  font-size:14px;
  color:#444;
  line-height:1.6;
  min-height:60px;
}

.message{
  font-weight:bold;
  color:#ff4d94;
  margin-top:10px;
}

button{
  margin-top:15px;
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:#ff7eb3;
  color:white;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

button:active{
  transform:scale(.95);
}

.heart{
  position:absolute;
  font-size:20px;
  animation:heartFloat 5s linear infinite;
  z-index:1;
}

@keyframes heartFloat{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-800px);opacity:0}
}
</style>
</head>

<body>

<div class="card">
  <img src="foto-kita.jpg" class="photo" alt="us">
  <p class="caption">this is us 🤍 and im right here</p>

  <h2>hey my love 💕</h2>

  <p class="text" id="typing"></p>

  <p class="message">
    i know u can do it <br>
    u dont need to be afraid my lovee 💗<br>
    im always with youu in everywhere 
  </p>

  <button onclick="showSupport()">click me yaa 🫶</button>
</div>

<script>
/* efek teks muncul pelan */
const text = "tarik napas pelan yaa… kamu ga sendirian. aku di sini, nemenin kamu sebelum kamu berjuang 🤍";
let i = 0;
function typeText(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText, 45);
  }
}
typeText();

/* tombol interaktif */
function showSupport(){
  const msgs = [
    "aku bangga banget sama kamu 😁",
    "pelan-pelan aja yaa 🤍",
    "aku pegang tangan kamu dari sini ",
    "kamu lebih kuat dari rasa takutmu 💗"
  ];
  alert(msgs[Math.floor(Math.random()*msgs.length)]);
}

/* animasi hati */
function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML=["💗","💕","🤍","💖"][Math.floor(Math.random()*4)];
  heart.style.left=Math.random()*100+"vw";
  heart.style.bottom="0";
  heart.style.fontSize=15+Math.random()*20+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,800);
</script>

</body>
</html>
